<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>業務モニター - Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg-primary:#f5f6f8;--bg-card:#fff;--bg-card-hover:#f0f1f4;--bg-elevated:#f0f1f5;--border:#e2e4ea;--border-light:#d0d3db;--text-primary:#1a1c24;--text-secondary:#5a5e6e;--text-muted:#8e92a2;--accent:#4f46e5;--accent-dim:rgba(79,70,229,0.08);--green:#10b981;--green-dim:rgba(16,185,129,0.08);--amber:#f59e0b;--amber-dim:rgba(245,158,11,0.08);--red:#ef4444;--red-dim:rgba(239,68,68,0.08);--cyan:#0891b2}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:3px}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:var(--bg-card);border-right:1px solid var(--border);padding:24px 0;display:flex;flex-direction:column;box-shadow:1px 0 4px rgba(0,0,0,0.03);position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{padding:0 24px 28px;border-bottom:1px solid var(--border);margin-bottom:20px}
.logo h1{font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px}
.logo-icon{width:28px;height:28px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.logo span{font-size:11px;color:var(--text-muted);display:block;margin-top:4px}
.nav-section{padding:0 12px;margin-bottom:24px}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);padding:0 12px;margin-bottom:8px;font-weight:500}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text-secondary);transition:all .15s}
.nav-item:hover{background:var(--bg-card-hover);color:var(--text-primary)}.nav-item.active{background:var(--accent-dim);color:var(--accent);font-weight:500}
.date-section{padding:0 12px;margin-bottom:20px}
.date-nav-sidebar{display:flex;align-items:center;gap:6px;padding:0 12px}
.date-btn{background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-secondary);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s}
.date-btn:hover{border-color:var(--border-light);color:var(--text-primary);background:var(--bg-card-hover)}
.date-btn:disabled{opacity:.3;cursor:not-allowed}
.date-display{font-family:'JetBrains Mono',monospace;font-size:12px;flex:1;text-align:center;color:var(--text-primary);font-weight:500}
.employee-list{padding:0 12px;flex:1}
.employee-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text-secondary);transition:all .15s}
.employee-item:hover{background:var(--bg-card-hover);color:var(--text-primary)}.employee-item.active{background:var(--accent-dim);color:var(--accent)}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.main{padding:28px 32px;overflow-y:auto;max-height:100vh}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.header-left h2{font-size:20px;font-weight:600}.header-left p{color:var(--text-muted);font-size:13px;margin-top:2px}
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500;margin-bottom:8px}
.stat-value{font-size:26px;font-weight:700;font-family:'JetBrains Mono',monospace;line-height:1}
.stat-sub{font-size:11px;color:var(--text-muted);margin-top:6px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.grid-full{margin-bottom:24px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}.card-body{padding:20px}
.timeline-item{display:grid;grid-template-columns:52px 12px 1fr;gap:12px;align-items:start;margin-bottom:4px;min-height:48px}
.timeline-time{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-muted);text-align:right;padding-top:2px}
.timeline-dot-col{display:flex;flex-direction:column;align-items:center;height:100%}
.timeline-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.timeline-line{width:1px;flex:1;background:var(--border);margin-top:4px}
.timeline-content{padding-bottom:12px}.timeline-label{font-size:13px;font-weight:500;margin-bottom:2px}.timeline-desc{font-size:12px;color:var(--text-muted)}
.activity-bar-container{display:flex;flex-direction:column;gap:6px}
.activity-row{display:flex;align-items:center;gap:10px}
.activity-label{font-size:11px;color:var(--text-muted);width:36px;text-align:right;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.activity-bar-track{flex:1;height:22px;display:flex;border-radius:3px;overflow:hidden;gap:1px}
.activity-segment{height:100%;cursor:pointer}.activity-segment:hover{opacity:.75}
.seg-work{background:var(--accent)}.seg-email{background:var(--cyan)}.seg-meeting{background:var(--amber)}.seg-idle{background:#d1d5db}.seg-browse{background:var(--red);opacity:.7}
.activity-legend{display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-secondary)}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.chart-container{display:flex;align-items:center;gap:24px}
.chart-canvas-wrap{width:160px;height:160px;flex-shrink:0}
.chart-legend{flex:1}
.chart-legend-item{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:13px}
.chart-legend-left{display:flex;align-items:center;gap:8px}
.chart-legend-color{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.chart-legend-pct{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-muted)}
.suggestion{padding:14px 16px;border-radius:8px;margin-bottom:10px;border-left:3px solid}
.suggestion:last-child{margin-bottom:0}
.suggestion-high{background:var(--accent-dim);border-color:var(--accent)}.suggestion-mid{background:var(--amber-dim);border-color:var(--amber)}.suggestion-low{background:var(--green-dim);border-color:var(--green)}
.suggestion-tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:500;margin-bottom:6px}
.suggestion-high .suggestion-tag{background:rgba(79,70,229,.15);color:var(--accent)}.suggestion-mid .suggestion-tag{background:rgba(245,158,11,.15);color:var(--amber)}.suggestion-low .suggestion-tag{background:rgba(16,185,129,.15);color:var(--green)}
.suggestion-title{font-size:13px;font-weight:600;margin-bottom:4px}.suggestion-desc{font-size:12px;color:var(--text-secondary);line-height:1.6}
.focus-chart-wrap{height:140px}
.log-table{width:100%;border-collapse:collapse;font-size:12px}
.log-table th{text-align:left;padding:8px 10px;background:var(--bg-elevated);color:var(--text-muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0}
.log-table td{padding:6px 10px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:11px}
.log-table tr:hover td{background:var(--bg-card-hover)}
.log-scroll{max-height:400px;overflow-y:auto}
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border)}
.tab-btn{padding:10px 20px;font-size:13px;font-family:inherit;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-muted);cursor:pointer}
.tab-btn:hover{color:var(--text-primary)}.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.tab-content{display:none}.tab-content.active{display:block}
.empty-state{text-align:center;padding:80px 0;color:var(--text-muted)}
.empty-state h3{font-size:18px;color:var(--text-secondary);margin-bottom:8px}
.empty-state p{font-size:13px;line-height:1.8}
.save-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary);font-size:12px;font-family:inherit;cursor:pointer;transition:all .15s}
.save-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.save-btn.saved{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
.save-btn svg{width:14px;height:14px}
.header-actions{display:flex;gap:8px;align-items:center}
.dl-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary);font-size:12px;font-family:inherit;cursor:pointer;transition:all .15s}
.dl-btn:hover{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.toast{position:fixed;bottom:24px;right:24px;background:var(--text-primary);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.ss-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ss-thumb{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--border);cursor:pointer;transition:all .15s;aspect-ratio:16/9;background:var(--bg-elevated)}
.ss-thumb:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(79,70,229,.15);transform:translateY(-1px)}
.ss-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ss-thumb-time{position:absolute;bottom:0;left:0;right:0;padding:4px 8px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;font-family:'JetBrains Mono',monospace}
.ss-empty{color:var(--text-muted);font-size:13px;text-align:center;padding:30px 0}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.lightbox.active{display:flex}
.lightbox img{max-width:95vw;max-height:90vh;border-radius:8px;box-shadow:0 4px 24px rgba(0,0,0,.5)}
.lightbox-info{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;font-family:'JetBrains Mono',monospace;background:rgba(0,0,0,.6);padding:6px 16px;border-radius:8px}
.lightbox-nav{position:fixed;top:50%;transform:translateY(-50%);color:#fff;font-size:32px;cursor:pointer;background:rgba(0,0,0,.4);border:none;padding:8px 14px;border-radius:8px;transition:background .15s}
.lightbox-nav:hover{background:rgba(0,0,0,.7)}
.lightbox-prev{left:16px}
.lightbox-next{right:16px}
.lightbox-close{position:fixed;top:16px;right:16px;color:#fff;font-size:24px;cursor:pointer;background:rgba(0,0,0,.4);border:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s}
.lightbox-close:hover{background:rgba(0,0,0,.7)}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;margin-left:8px;background:var(--accent-dim);color:var(--accent)}
.footer{padding:20px 12px;border-top:1px solid var(--border);margin-top:auto}
.footer p{font-size:10px;color:var(--text-muted);text-align:center;line-height:1.6}
@media(max-width:1200px){.stats-row{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1100px){.grid-2{grid-template-columns:1fr}.stats-row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.app{grid-template-columns:1fr}.sidebar{display:none}.main{padding:16px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="logo">
<h1><div class="logo-icon">W</div>業務モニター</h1>
<span>Work Analytics Dashboard</span>
</div>
<div class="date-section">
<div class="nav-label" style="padding:0 12px;margin-bottom:8px">日付</div>
<div class="date-nav-sidebar">
<button class="date-btn" id="prevBtn" onclick="chgDate(-1)">&#9664;</button>
<span class="date-display" id="dateDisplay"></span>
<button class="date-btn" id="nextBtn" onclick="chgDate(1)">&#9654;</button>
</div>
</div>
<div class="nav-section">
<div class="nav-label">メニュー</div>
<div class="nav-item active">ダッシュボード</div>
</div>
<div class="nav-section">
<div class="nav-label">メンバー</div>
<div class="employee-list" id="employeeList"></div>
</div>
<div class="footer">
<p>GitHub Pages Static Dashboard<br>Data updated via export script</p>
</div>
</aside>
<main class="main" id="mainContent">
<div class="empty-state">読み込み中...</div>
</main>
</div>
<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
<button class="lightbox-close" onclick="closeLightbox()">&times;</button>
<button class="lightbox-nav lightbox-prev" onclick="navLightbox(event,-1)">&#9664;</button>
<img id="lightboxImg" src="" alt="">
<button class="lightbox-nav lightbox-next" onclick="navLightbox(event,1)">&#9654;</button>
<div class="lightbox-info" id="lightboxInfo"></div>
</div>

<script>
const CC = {work:'#4f46e5', email:'#0891b2', meeting:'#f59e0b', idle:'#d1d5db', browse:'#ef4444'};
let S = {date: null, employees: {}, cur: null, names: [], dateIndex: []};
let charts = {};

// Detect base path for GitHub Pages
const BASE = (function() {
  const path = location.pathname;
  // If served from /repo-name/docs/ or /repo-name/, detect the base
  const idx = path.lastIndexOf('/docs/');
  if (idx >= 0) return path.substring(0, idx + 6);
  // For GitHub Pages, index.html is at root of docs/
  const parts = path.split('/').filter(Boolean);
  if (parts.length > 0 && parts[parts.length - 1].includes('.')) parts.pop();
  return '/' + parts.join('/') + (parts.length ? '/' : '');
})();

async function loadDateIndex() {
  try {
    const r = await fetch(BASE + 'data/index.json');
    if (r.ok) {
      const data = await r.json();
      S.dateIndex = (data.dates || []).sort().reverse();
    }
  } catch(e) {
    S.dateIndex = [];
  }
  // Set initial date from URL hash or latest available
  const hash = location.hash.replace('#', '');
  if (hash && S.dateIndex.includes(hash)) {
    S.date = hash;
  } else if (S.dateIndex.length > 0) {
    S.date = S.dateIndex[0];
  } else {
    S.date = new Date().toISOString().split('T')[0];
  }
}

async function loadData(d) {
  try {
    const r = await fetch(BASE + 'data/data_' + d + '.json');
    if (!r.ok) { S.employees = {}; S.names = []; return; }
    const data = await r.json();
    S.employees = data.employees || {};
    S.names = Object.keys(S.employees);
    if (S.names.length > 0 && !S.cur) S.cur = S.names[0];
  } catch(e) {
    S.employees = {};
    S.names = [];
  }
}

function updateDateNav() {
  var saved = isDateSaved(S.date) ? ' ★' : '';
  document.getElementById('dateDisplay').textContent = S.date + saved;
  const curIdx = S.dateIndex.indexOf(S.date);
  document.getElementById('nextBtn').disabled = (curIdx <= 0);
  document.getElementById('prevBtn').disabled = (curIdx < 0 || curIdx >= S.dateIndex.length - 1);
}

function renderEmpList() {
  const el = document.getElementById('employeeList');
  if (!S.names.length) {
    el.innerHTML = '<div style="padding:12px;font-size:12px;color:var(--text-muted)">データなし</div>';
    return;
  }
  const colors = ['#4f46e5','#0891b2','#10b981','#f59e0b','#ef4444','#8b5cf6'];
  el.innerHTML = S.names.map(n => {
    const c = colors[n.charCodeAt(0) % colors.length];
    return '<div class="employee-item ' + (n === S.cur ? 'active' : '') + '" onclick="selEmp(\'' + n.replace(/'/g, "\\'") + '\')">' +
      '<div class="avatar" style="background:' + c + '18;color:' + c + '">' + n[0] + '</div>' + esc(n) + '</div>';
  }).join('');
}

function selEmp(n) { S.cur = n; renderEmpList(); render(); }

function render() {
  const m = document.getElementById('mainContent');
  destroyCharts();

  if (!S.names.length) {
    m.innerHTML = '<div class="empty-state"><h3>データがありません</h3><p>' + esc(S.date) + ' のレポートデータが見つかりません。<br>export_to_pages.py を実行してデータをエクスポートしてください。</p></div>';
    return;
  }
  if (!S.cur || !S.employees[S.cur]) {
    m.innerHTML = '<div class="empty-state">従業員を選択してください</div>';
    return;
  }

  const d = S.employees[S.cur], s = d.summary || {};
  const totalChars = s.total_chars ? Number(s.total_chars).toLocaleString() + '字' : '-';
  const isSaved = isDateSaved(S.date);

  m.innerHTML =
    '<div class="header"><div class="header-left"><h2>' + esc(S.cur) + ' の業務レポート</h2><p>日次業務分析ダッシュボード</p></div><div class="header-actions"><button class="save-btn' + (isSaved ? ' saved' : '') + '" onclick="toggleSave()" title="この日を保護（自動削除の対象外にする）"><svg viewBox="0 0 24 24" fill="' + (isSaved ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>' + (isSaved ? '保護中' : '保護する') + '</button><button class="dl-btn" onclick="downloadReport()" title="この日のレポートをダウンロード"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>DL</button><span style="font-family:JetBrains Mono,monospace;font-size:14px;color:var(--text-muted)">' + esc(S.date) + '</span></div></div>' +
    '<div class="stats-row">' +
      sc('稼働時間', s.total_hours || '-', '') +
      sc('集中スコア', s.focus_score || '-', '', 'var(--green)') +
      sc('メインアプリ', s.top_app || '-', s.top_app_pct ? s.top_app_pct + '%' : '', null, true) +
      sc('入力文字数', totalChars, '') +
      sc('改善提案', (d.suggestions || []).length, '') +
    '</div>' +
    '<div class="grid-2">' +
      '<div class="card"><div class="card-header"><span class="card-title">時間帯別アクティビティ</span></div><div class="card-body"><div id="actBars" class="activity-bar-container"></div>' +
      '<div class="activity-legend">' +
        legendItem('var(--accent)', '業務アプリ') +
        legendItem('var(--cyan)', 'メール') +
        legendItem('var(--amber)', '電話/打合せ') +
        legendItem('#d1d5db', '離席') +
        legendItem('var(--red)', 'ブラウザ') +
      '</div></div></div>' +
      '<div class="card"><div class="card-header"><span class="card-title">時間配分</span></div><div class="card-body"><div class="chart-container"><div class="chart-canvas-wrap"><canvas id="pieChart"></canvas></div><div id="pieLeg" class="chart-legend"></div></div></div></div>' +
    '</div>' +
    '<div class="grid-2">' +
      '<div class="card"><div class="card-header"><span class="card-title">タイムライン</span></div><div class="card-body"><div id="timeline" class="timeline"></div></div></div>' +
      '<div class="card"><div class="card-header"><span class="card-title">AI 改善提案</span></div><div class="card-body" id="suggestions"></div></div>' +
    '</div>' +
    '<div class="grid-full"><div class="card"><div class="card-header"><span class="card-title">スクリーンショット</span><span class="badge" id="ssCount"></span></div><div class="card-body"><div id="ssGallery" class="ss-gallery"></div></div></div></div>' +
    '<div class="grid-full"><div class="card"><div class="card-header"><span class="card-title">集中度の推移</span></div><div class="card-body"><div class="focus-chart-wrap"><canvas id="focusChart"></canvas></div></div></div></div>' +
    '<div class="grid-full"><div class="card"><div class="tab-bar"><button class="tab-btn active" onclick="switchTab(this,\'tabWL\')">ウィンドウログ</button></div>' +
    '<div class="card-body"><div id="tabWL" class="tab-content active"><div id="winLog" class="log-scroll"></div></div></div></div></div>';

  renderBars(d); renderPie(d); renderTL(d); renderSug(d); renderScreenshots(d); renderFocus(d); renderWinLog(d);
}

function legendItem(bg, label) {
  return '<div class="legend-item"><div class="legend-dot" style="background:' + bg + '"></div>' + label + '</div>';
}

function sc(l, v, sub, col, sm) {
  return '<div class="stat-card"><div class="stat-label">' + l + '</div><div class="stat-value" style="' +
    (col ? 'color:' + col + ';' : '') + (sm ? 'font-size:16px;padding-top:6px;' : '') + '">' + v +
    '</div>' + (sub ? '<div class="stat-sub">' + sub + '</div>' : '') + '</div>';
}

function switchTab(btn, id) {
  btn.parentElement.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  btn.closest('.card').querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function renderBars(d) {
  const bars = d.activity_bars || {}, el = document.getElementById('actBars');
  const cls = ['seg-work','seg-email','seg-meeting','seg-idle','seg-browse'];
  el.innerHTML = Object.entries(bars).sort().map(function([h, segs]) {
    const inner = segs.map(function(p, i) {
      return p > 0 ? '<div class="activity-segment ' + cls[i] + '" style="width:' + p + '%"></div>' : '';
    }).join('');
    return '<div class="activity-row"><span class="activity-label">' + h + ':00</span><div class="activity-bar-track">' + inner + '</div></div>';
  }).join('');
}

function renderPie(d) {
  const tb = d.time_breakdown || [];
  if (!tb.length) return;
  const ctx = document.getElementById('pieChart');
  if (!ctx) return;
  charts.pie = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: tb.map(x => x.label),
      datasets: [{data: tb.map(x => x.pct), backgroundColor: tb.map(x => x.color), borderWidth: 0, spacing: 2}]
    },
    options: {responsive: true, maintainAspectRatio: true, cutout: '65%', plugins: {legend: {display: false}}}
  });
  document.getElementById('pieLeg').innerHTML = tb.map(x =>
    '<div class="chart-legend-item"><div class="chart-legend-left"><div class="chart-legend-color" style="background:' + x.color + '"></div>' + esc(x.label) +
    '</div><span class="chart-legend-pct">' + x.pct + '%</span></div>'
  ).join('');
}

function renderTL(d) {
  const tl = d.timeline || [], el = document.getElementById('timeline');
  el.innerHTML = tl.map(function(x, i) {
    const c = CC[x.category] || '#9ca3af';
    return '<div class="timeline-item"><span class="timeline-time">' + esc(x.time) + '</span><div class="timeline-dot-col"><div class="timeline-dot" style="background:' + c + '"></div>' +
      (i < tl.length - 1 ? '<div class="timeline-line"></div>' : '') +
      '</div><div class="timeline-content"><div class="timeline-label">' + esc(x.label) + '</div><div class="timeline-desc">' + esc(x.desc || '') + '</div></div></div>';
  }).join('');
}

function renderSug(d) {
  const sg = d.suggestions || [], el = document.getElementById('suggestions');
  if (!sg.length) { el.innerHTML = '<div style="color:var(--text-muted);font-size:13px">改善提案なし</div>'; return; }
  const ll = {high:'優先度 高', mid:'優先度 中', low:'優先度 低'};
  el.innerHTML = sg.map(s =>
    '<div class="suggestion suggestion-' + s.level + '"><div class="suggestion-tag">' + (ll[s.level] || s.level) +
    '</div><div class="suggestion-title">' + esc(s.title) + '</div><div class="suggestion-desc">' + esc(s.desc) + '</div></div>'
  ).join('');
}

function renderFocus(d) {
  const fd = d.focus_data || [];
  if (!fd.length) return;
  const ctx = document.getElementById('focusChart');
  if (!ctx) return;
  const fh = d.focus_hours || [9, 18];
  const labels = fd.map(function(_, i) { const h = fh[0] + i; return (h < 10 ? '0' : '') + h + ':00'; });
  charts.focus = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        data: fd, borderColor: '#4f46e5', backgroundColor: 'rgba(79,70,229,0.06)',
        borderWidth: 2, fill: true, tension: .4, pointRadius: 4,
        pointBackgroundColor: '#4f46e5', pointBorderColor: '#fff', pointBorderWidth: 2
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        y: {min: 0, max: 100, grid: {color: '#e2e4ea'}, ticks: {color: '#8e92a2', font: {size: 11, family: 'JetBrains Mono'}, stepSize: 25}},
        x: {grid: {color: '#e2e4ea'}, ticks: {color: '#8e92a2', font: {size: 11, family: 'JetBrains Mono'}}}
      },
      plugins: {legend: {display: false}}
    }
  });
}

function renderWinLog(d) {
  const log = d.window_log || [], el = document.getElementById('winLog');
  if (!log.length) { el.innerHTML = '<div style="color:var(--text-muted);font-size:13px;padding:20px">ウィンドウログなし</div>'; return; }
  var h = '<table class="log-table"><thead><tr><th>時刻</th><th>プロセス</th><th>ウィンドウタイトル</th></tr></thead><tbody>';
  log.forEach(function(e) {
    var t = e.timestamp.split('T')[1].substring(0, 8);
    h += '<tr><td>' + t + '</td><td>' + esc(e.process_name) + '</td><td>' + esc(e.active_window.substring(0, 100)) + '</td></tr>';
  });
  h += '</tbody></table>';
  el.innerHTML = h;
}

function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function destroyCharts() { Object.values(charts).forEach(c => c.destroy()); charts = {}; }

// Screenshot gallery + lightbox
var ssItems = [];
var ssIdx = 0;

function renderScreenshots(d) {
  var shots = d.screenshots || [];
  var el = document.getElementById('ssGallery');
  var countEl = document.getElementById('ssCount');
  ssItems = shots;
  if (!shots.length) {
    el.innerHTML = '<div class="ss-empty">スクリーンショットなし<br><span style="font-size:11px;margin-top:4px;display:block">export_to_pages.py --include-screenshots で埋め込めます</span></div>';
    countEl.textContent = '';
    return;
  }
  countEl.textContent = shots.length + '枚';
  el.innerHTML = shots.map(function(s, i) {
    var time = s.time || '';
    return '<div class="ss-thumb" onclick="openLightbox(' + i + ')">' +
      '<img src="' + s.data + '" alt="' + esc(time) + '" loading="lazy">' +
      '<div class="ss-thumb-time">' + esc(time) + '</div></div>';
  }).join('');
}

function openLightbox(i) {
  if (!ssItems.length) return;
  ssIdx = i;
  var lb = document.getElementById('lightbox');
  document.getElementById('lightboxImg').src = ssItems[i].data;
  document.getElementById('lightboxInfo').textContent = ssItems[i].time || '';
  lb.classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(e) {
  if (e && e.target !== e.currentTarget && !e.target.classList.contains('lightbox-close')) return;
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
}
function navLightbox(e, delta) {
  e.stopPropagation();
  ssIdx = (ssIdx + delta + ssItems.length) % ssItems.length;
  document.getElementById('lightboxImg').src = ssItems[ssIdx].data;
  document.getElementById('lightboxInfo').textContent = ssItems[ssIdx].time || '';
}
document.addEventListener('keydown', function(e) {
  var lb = document.getElementById('lightbox');
  if (!lb.classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navLightbox(e, -1);
  if (e.key === 'ArrowRight') navLightbox(e, 1);
});

// Save/Protect functionality
function getSavedDates() {
  try { return JSON.parse(localStorage.getItem('wm_saved_dates') || '[]'); } catch(e) { return []; }
}
function isDateSaved(d) { return getSavedDates().includes(d); }
function toggleSave() {
  var dates = getSavedDates();
  var idx = dates.indexOf(S.date);
  if (idx >= 0) {
    dates.splice(idx, 1);
    showToast(S.date + ' の保護を解除しました');
  } else {
    dates.push(S.date);
    showToast(S.date + ' を保護しました（自動削除の対象外）');
  }
  localStorage.setItem('wm_saved_dates', JSON.stringify(dates));
  render();
}
function downloadReport() {
  if (!S.cur || !S.employees[S.cur]) return;
  var data = { date: S.date, employee: S.cur, data: S.employees[S.cur] };
  var blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'report_' + S.cur + '_' + S.date + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('レポートをダウンロードしました');
}
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  setTimeout(function() { t.style.opacity = '0'; }, 2500);
}

async function chgDate(delta) {
  const curIdx = S.dateIndex.indexOf(S.date);
  // dateIndex is sorted descending (newest first), so -1 = newer, +1 = older
  const newIdx = curIdx - delta;
  if (newIdx < 0 || newIdx >= S.dateIndex.length) return;
  S.date = S.dateIndex[newIdx];
  S.cur = null;
  location.hash = S.date;
  await loadData(S.date);
  updateDateNav();
  renderEmpList();
  render();
}

// Initialize
(async function() {
  await loadDateIndex();
  await loadData(S.date);
  updateDateNav();
  renderEmpList();
  render();
})();
